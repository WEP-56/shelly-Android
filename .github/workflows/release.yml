name: Release

# Tagging `vX.Y.Z` publishes that version: split-per-ABI release APKs attached to
# a GitHub Release. Signing material comes from repository secrets only; nothing
# secret is echoed, and the keystore is written to the runner temp dir, never to
# the workspace.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SHELLY_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        # Pinned to the toolchain the app was developed and device-tested with,
        # so a new stable release cannot silently change the published APK.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Check the tag against pubspec.yaml
        id: version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(awk '/^version:/ { sub(/^version:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit }' pubspec.yaml)"
          version_name="${pubspec_version%%+*}"
          if [ -z "$version_name" ]; then
            echo "::error::pubspec.yaml has no version: line"
            exit 1
          fi
          if [ "$tag_version" != "$version_name" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version"
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "full=$pubspec_version" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Decode the release keystore
        if: env.SHELLY_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/shelly-release.jks"
          printf '%s' "$SHELLY_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "SHELLY_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build split-per-ABI release APKs
        env:
          SHELLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SHELLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SHELLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Report R8 missing rules on failure
        # The runner is discarded after the job, so R8's missing_rules.txt has to
        # be printed here or the next attempt has to guess.
        if: failure()
        run: |
          missing_rules='build/app/outputs/mapping/release/missing_rules.txt'
          if [ -f "$missing_rules" ]; then
            echo "--- $missing_rules ---"
            cat "$missing_rules"
          else
            echo "no missing_rules.txt; the failure is not an R8 missing-class error"
          fi

      - name: Collect artifacts
        id: artifacts
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.name }}'
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            source_apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ ! -f "$source_apk" ]; then
              echo "::error::missing $source_apk"
              exit 1
            fi
            cp "$source_apk" "dist/shelly-$version-$abi.apk"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          ls -l dist
          if [ -n "${SHELLY_KEYSTORE_PATH:-}" ]; then
            echo 'signing=使用仓库 secrets 中的发布密钥签名。' >> "$GITHUB_OUTPUT"
          else
            echo 'signing=⚠️ 未配置发布密钥，本次产物使用 debug 签名，仅供测试安装。' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Shelly ${{ steps.version.outputs.full }}

            按设备 ABI 下载对应 APK，应用内的“检查更新”只会把你带到本页面，不会自动下载或安装：

            - `shelly-${{ steps.version.outputs.name }}-arm64-v8a.apk` — 绝大多数现代 Android 设备
            - `shelly-${{ steps.version.outputs.name }}-armeabi-v7a.apk` — 32 位 ARM 设备
            - `shelly-${{ steps.version.outputs.name }}-x86_64.apk` — 模拟器和 x86_64 设备

            `SHA256SUMS.txt` 可用于校验下载完整性。

            ${{ steps.artifacts.outputs.signing }}
