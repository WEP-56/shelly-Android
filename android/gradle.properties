org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin 的增量编译缓存把源文件路径存成相对于 Gradle 根目录（D:\shelly-Android\android）
# 的形式。本机 pub cache 在 C:\Users\...\Pub\Cache，Windows 上跨盘无法取相对路径，
# File.relativeTo 会抛 "this and base files have different roots"，于是每个带 Kotlin
# 源码的插件模块（package_info_plus / local_auth_android / url_launcher_android /
# wakelock_plus …）都会刷一大片 "Could not close incremental caches" +
# "Daemon compilation failed: null"，然后 Gradle 悄悄退回非守护进程编译——构建能过，
# 但每次都白跑一遍。这里的 Kotlin 代码只有 MainActivity.kt 和插件，关掉增量编译没有
# 实际代价。根因修复是把 PUB_CACHE 移到和项目同一个盘，那属于本机环境改动。
kotlin.incremental=false
